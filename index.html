<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسكوب</title>
<meta name="description" content="أتمتة عمليات مسكوب">
<meta name="theme-color" content="#0758a7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مسكوب">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="favicon.ico?v=2" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Sans+Arabic:wght@400;500;700&family=Noto+Sans+Bengali:wght@400;500;700&display=swap">
<style>
/* Layout: a flat Maskob-blue header band with the wordmark, then one working column. Two brand colours only: blue for structure, orange for action and attention. No illustrations. */
:root{
  --brand:#0758a7; --brand-orange:#ef8a22; --logo:url(maskob-wordmark.png);
  --navy:#0758a7; --navy-ink:#04427f; --sun:#ef8a22; --sun-ink:#b8640f; --lav:#3f80c4;
  --bg:#f4f7fb; --card:#ffffff; --fg:#0b2545; --muted:#56708f; --line:#dce5f0; --soft:#edf3fa;
  --sun-soft:#fdf1e3; --lav-soft:#e6eff9; --sand-soft:#fdf1e3;
  --ok:#0758a7; --ok-soft:#e6eff9; --bad:#b8640f; --bad-soft:#fdf1e3;
  --late:#d32f2f; --late-soft:#fdecec;
  --hdr:#0758a7; --on-hdr:#ffffff;
  --f-display:"Tajawal","Noto Sans Arabic","Noto Sans Bengali",Tahoma,sans-serif;
  --f-body:"Tajawal","Noto Sans Arabic","Noto Sans Bengali",Tahoma,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#6aa9ec; --navy-ink:#b9d6f5; --sun:#f39a45; --sun-ink:#f6ae67; --lav:#6aa9ec;
  --bg:#071a33; --card:#0d2647; --fg:#eaf2fb; --muted:#93abc9; --line:#1d3a63; --soft:#11305a;
  --sun-soft:#3a2915; --lav-soft:#12345f; --sand-soft:#3a2915;
  --ok:#6aa9ec; --ok-soft:#12345f; --bad:#f6ae67; --bad-soft:#3a2915;
  --hdr:#0758a7; --on-hdr:#ffffff;
  --late:#ff7a70; --late-soft:#3d1a1e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#6aa9ec; --navy-ink:#b9d6f5; --sun:#f39a45; --sun-ink:#f6ae67; --lav:#6aa9ec;
  --bg:#071a33; --card:#0d2647; --fg:#eaf2fb; --muted:#93abc9; --line:#1d3a63; --soft:#11305a;
  --sun-soft:#3a2915; --lav-soft:#12345f; --sand-soft:#3a2915;
  --ok:#6aa9ec; --ok-soft:#12345f; --bad:#f6ae67; --bad-soft:#3a2915;
  --hdr:#0758a7; --on-hdr:#ffffff;
  --late:#ff7a70; --late-soft:#3d1a1e;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.65}
.lang-bn{font-family:"Noto Sans Bengali","Tajawal",sans-serif}
.lang-ur{font-family:"Noto Sans Arabic","Tajawal",sans-serif;line-height:1.75}
h2,.cat-h,.rp-sec h3,.tile .nm,.oc .t,.stat b{font-weight:700}
.lang-bn h2,.lang-bn .cat-h,.lang-bn .rp-sec h3,.lang-ur h2,.lang-ur .cat-h,.lang-ur .rp-sec h3{font-family:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* header band */
.scene{background:var(--hdr);color:var(--on-hdr);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.scene .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.logo{display:flex;flex-direction:column;align-items:flex-start}
.logo .ar{font-family:"Tajawal","Noto Sans Arabic",sans-serif;font-weight:800;font-size:32px;line-height:1.1;color:var(--on-hdr);position:relative;direction:rtl}
.logo .ar i{position:absolute;top:-4px;left:38%;width:7px;height:7px;border-radius:50%;background:var(--sun)}
.logo .en{font-weight:500;letter-spacing:.42em;font-size:10.5px;color:var(--on-hdr);margin-top:2px;direction:ltr}
.logo .sub{font-size:13px;color:var(--on-hdr);opacity:.78;margin-top:6px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.langsel{appearance:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:var(--on-hdr);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.langsel option{color:#0f1e4d;background:#fff}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:var(--on-hdr);border-radius:999px;padding-block:5px;padding-inline:12px 5px;font-size:13px}
.who b{font-weight:500}
.who button{border:0;background:var(--sun);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{background:var(--navy);color:var(--card);font-weight:500}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--sun);color:#fff;font-size:13px;display:inline-grid;place-items:center;font-weight:700}

main{padding-block:18px 140px}
h2{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:13px;margin:2px 0 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.note-bar{border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;background:var(--sun-soft);border:1px solid color-mix(in srgb,var(--sun) 35%,transparent)}

/* role picker */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}
.role{text-align:start;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.role:hover{border-color:var(--navy)}
.role .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--lav-soft);color:var(--navy)}
.role .ic svg{width:26px;height:26px}
.role h3{margin:0;font-family:var(--f-display);font-size:20px;font-weight:500}
.role p{margin:0;color:var(--muted);font-size:13px}
.role select{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}

/* new order */
.kind{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.kind button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:500;color:var(--muted)}
.kind button[aria-pressed="true"]{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(20,30,80,.12)}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search:focus-within{border-color:var(--navy)}
.search input{border:0;background:transparent;padding:11px 0;flex:1;min-width:0;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;white-space:nowrap;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--card)}
.chip .c{font-size:13px;opacity:.75}
.cat-h{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-family:var(--f-display);font-size:17px;font-weight:500;color:var(--navy-ink)}
.cat-h::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--sun);flex:none}
.cat-h small{font-family:var(--f-body);color:var(--muted);font-size:13px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.tile{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile.on{border-color:var(--navy);background:var(--lav-soft)}
.tile .tap{border:0;background:transparent;padding:0;text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.tile .tap:hover .nm{color:var(--navy)}
.tile .nm{font-weight:500;line-height:1.35;overflow-wrap:anywhere;padding-inline-end:30px}
.tile .alt{font-size:13px;color:var(--muted);overflow-wrap:anywhere;line-height:1.35}
.tile .meta{font-size:13px;color:var(--muted)}
.tile .q{position:absolute;top:8px;inset-inline-end:8px;background:var(--sun);color:#fff;border-radius:999px;min-width:26px;height:26px;padding:0 7px;display:grid;place-items:center;font-weight:700;font-size:13px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.step button{border:0;background:var(--soft);width:34px;height:34px;font-size:18px;font-weight:500;color:var(--navy);flex:none}
.step input{width:100%;min-width:0;border:0;text-align:center;background:transparent;padding:0;height:34px;font-weight:500;font-variant-numeric:tabular-nums;outline:none}
.step.sm button{width:30px;height:30px}.step.sm input{height:30px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}

/* cart bar */
.cartbar{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--navy-ink);color:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"] .cartbar{background:#0a0f28}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cartbar{background:#0a0f28}}
.cartbar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.cartbar .sum{flex:1;min-width:0;font-size:14px}
.cartbar .sum b{font-size:17px}
.btn{border:0;border-radius:11px;padding:10px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-sun{background:var(--sun);color:#fff}
.btn-navy{background:var(--navy);color:var(--card)}
.btn-ghost{background:var(--soft);color:var(--fg)}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* order cards */
.list{display:flex;flex-direction:column;gap:10px}
.oc{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:start;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--navy);border-radius:var(--r);padding:14px;width:100%}
.oc.ret{border-inline-start-color:var(--sun)}
.oc:hover{border-color:var(--navy)}
.oc .t{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.oc .s{font-size:13px;color:var(--muted)}
.oc .n{direction:ltr;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pending{background:var(--sun-soft);color:var(--sun-ink)}
.st-approved{background:var(--lav-soft);color:var(--navy)}
.st-shipped{background:var(--sun);color:#fff}
.st-received{background:var(--navy);color:var(--card)}
.st-rejected,.st-cancelled{background:var(--soft);color:var(--muted)}
.tag{font-size:13px;padding:2px 8px;border-radius:6px;background:var(--lav-soft);color:var(--navy);font-weight:500}
.tag.ret{background:var(--sun-soft);color:var(--sun-ink)}
.bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sun);border-radius:999px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}

/* sheet */
.veil{position:fixed;inset:0;z-index:40;background:rgba(10,16,45,.45);display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:800px){.veil{align-items:center}.sheet{border-radius:20px;max-height:90%}}
.sh-head{padding:16px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--line)}
.sh-body{overflow-y:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 16px max(18px,env(safe-area-inset-left,0px));flex:1;min-height:0}
.sh-foot{padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:10px;font-size:18px;flex:none}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.tl{font-size:13px;color:var(--muted);border-top:3px solid var(--line);padding-top:6px;min-width:0}
.tl b{display:block;color:var(--fg);font-size:13px}
.tl.done{border-color:var(--navy)}
.tl.cur{border-color:var(--sun)}
.tl.bad{border-color:var(--bad)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.box h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:500}
.lines{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ln{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.ln.has-chk{grid-template-columns:auto 1fr auto}
.ln:first-child{border-top:0}
.ln .nm{font-weight:500;line-height:1.3}
.ln .sub{font-size:13px;color:var(--muted)}
.ln .ctl{width:132px}
.ln.done{background:color-mix(in srgb,var(--ok-soft) 60%,var(--card))}
.ln.done .nm{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.ln.diff{background:color-mix(in srgb,var(--sun-soft) 70%,var(--card))}
.ln .wide{grid-column:1 / -1}
.chk{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:transparent;flex:none;font-size:18px;font-weight:700;line-height:1}
.chk.on{background:var(--navy);border-color:var(--navy);color:var(--card)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:13px;color:var(--muted);font-weight:500;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .mis{color:var(--bad);font-weight:700}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
textarea,.field{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;resize:vertical;min-height:40px}
.mini-in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.prog .bar{flex:1;margin:0;height:8px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:500;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.pin{max-width:340px;margin:10px auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.dots{display:flex;gap:12px;direction:ltr;min-height:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy);display:block}
.dots i.f{background:var(--navy)}
.pin .err .chk-note{color:var(--muted);font-weight:500}
.pin .err{color:var(--bad);font-size:13px;min-height:20px;font-weight:500}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;direction:ltr}
.pad button{height:58px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--lav-soft)}
.pad button.fn{font-size:14px;color:var(--muted)}
.codes{display:flex;flex-direction:column;gap:8px;max-width:520px;margin-top:10px}
.code{display:grid;grid-template-columns:1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.code .set{font-size:13px;color:var(--ok);font-weight:500}.code .unset{font-size:13px;color:var(--bad);font-weight:500}
.code .wide{grid-column:1 / -1;display:flex;gap:8px}
.code input{flex:1;min-width:0;direction:ltr;text-align:center;letter-spacing:.3em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.stat.hot{border-color:color-mix(in srgb,var(--sun) 50%,var(--line));background:color-mix(in srgb,var(--sun-soft) 60%,var(--card))}
.stat.hot b{color:var(--sun)}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.daybar input{width:auto;min-width:0}
.attn{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.attn div{background:var(--card);border:1px solid var(--line);border-inline-start:3px solid var(--sun);border-radius:10px;padding:8px 12px;font-size:13.5px}
.attn div.bad{border-inline-start-color:var(--bad)}
.rp-sec{margin-top:24px}
.rp-sec h3{font-family:var(--f-display);font-size:17px;font-weight:500;margin:0}
.lang-bn .rp-sec h3,.lang-ur .rp-sec h3{font-family:var(--f-body)}
.rp-text{width:100%;min-height:200px;margin-top:10px;font-size:13px}
.fc-card{background:var(--card);border:1px solid color-mix(in srgb,var(--sun) 45%,var(--line));border-radius:var(--r);padding:12px 14px;margin:14px 0 4px}
.fc-card.muted{border-color:var(--line)}
.fc-card .bar{margin-top:8px}
.fc-tag{color:var(--sun);font-weight:700}
.tr-up{color:var(--sun);font-weight:500}.tr-down{color:var(--lav);font-weight:500}.tr-flat{color:var(--muted)}
.cf-high{color:var(--ok);font-weight:500}.cf-mid{color:var(--fg)}.cf-low{color:var(--muted)}
.wchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.wchip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.fc-sec{margin-top:26px}
.brs{display:flex;flex-direction:column;gap:8px;max-width:520px}
.br{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.br b{flex:1}
@media (max-width:560px){
  .logo .ar{font-size:32px}
  .scene .wrap{flex-direction:column;gap:10px}
  .ln .ctl{width:116px}
  .timeline{grid-template-columns:repeat(2,1fr)}
  .oc{grid-template-columns:auto 1fr}
  .oc .side{grid-column:1 / -1;display:flex;gap:8px;align-items:center;justify-content:space-between}

/* ---------- identity refinement ---------- */
:root{--shadow:0 1px 2px rgba(15,30,77,.06),0 2px 8px rgba(15,30,77,.04);--shadow-lg:0 8px 30px rgba(15,30,77,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:none;--shadow-lg:0 8px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--shadow:none;--shadow-lg:0 8px 30px rgba(0,0,0,.35)}

/* header: centred lockup as on the cup, orange rule underneath */
.scene{border-bottom:3px solid var(--sun)}
.scene .wrap{padding-block:12px}
.logo{display:block;width:134px;height:56px;background:var(--logo) center/contain no-repeat;flex:none}
.brand-badge{width:116px;height:116px;border-radius:50%;background:var(--brand) var(--logo) center/74% auto no-repeat;flex:none;box-shadow:0 6px 18px rgba(7,88,167,.25)}
@media (max-width:560px){.logo{width:120px;height:50px}}

/* tab bar: white strip, blue text, orange indicator */
.tabs{background:var(--card);box-shadow:var(--shadow)}
.tabs .wrap{gap:0;padding-block:0}
.tab{border-radius:0;padding:14px 16px;position:relative;color:var(--muted);font-weight:500}
.tab:hover{color:var(--navy)}
.tab[aria-selected="true"]{background:transparent;color:var(--navy);font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;inset:auto 12px 0 12px;height:3px;border-radius:3px 3px 0 0;background:var(--sun)}

/* type */
main{padding-block:24px 140px}
h2{font-size:22px;color:var(--navy-ink);line-height:1.35;margin-bottom:12px}
.hint{font-size:13.5px}

/* buttons: one height, one radius */
.btn{min-height:40px;padding:0 18px;border-radius:10px;font-weight:700;font-size:14px;transition:background .15s,border-color .15s,color .15s}
.btn-navy:hover{background:var(--navy-ink)}
.btn-sun:hover{background:var(--sun-ink)}
.btn-ghost{background:var(--card);color:var(--navy);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--navy)}
.btn-bad{background:transparent;color:var(--sun-ink);border:1px solid color-mix(in srgb,var(--sun) 45%,var(--line))}
.btn-ok{background:var(--navy);color:var(--card)}
.cartbar{background:var(--hdr);border-top:3px solid var(--sun)}
.cartbar .btn-ghost{background:transparent!important;border-color:rgba(255,255,255,.35);color:#fff!important}

/* surfaces */
.tile,.oc,.lines,.box,.scroll,.stat,.fc-card,.code,.empty,.search,.pin{box-shadow:var(--shadow)}
.tile{border-width:1px;border-radius:12px}
.tile:hover{border-color:color-mix(in srgb,var(--navy) 40%,var(--line))}
.tile.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset,var(--shadow)}
.tile .q{top:10px;inset-inline-end:10px;min-width:24px;height:24px;font-size:13px}
.step{border-radius:9px}
.step button{color:var(--navy);transition:background .15s,color .15s}
.step button:hover{background:var(--navy);color:var(--card)}
.chip{border-radius:8px;padding:6px 12px;font-weight:500}
.chip[aria-pressed="true"]{font-weight:500}
.kind{border-radius:10px}
.kind button{border-radius:8px}
.oc:hover{border-color:color-mix(in srgb,var(--navy) 40%,var(--line))}
.empty{border-style:solid}
.stat b{color:var(--navy-ink)}
.stat.hot b{color:var(--sun-ink)}
.sh-head h2{font-size:20px}

/* code screen */
.pin{max-width:360px;margin-top:28px;padding:28px 24px;border-radius:16px;box-shadow:var(--shadow-lg);border-top:3px solid var(--sun)}
.pad{grid-template-columns:repeat(3,76px);gap:10px}
.pad button{background:var(--card);border-radius:12px;font-size:22px;color:var(--navy-ink);transition:background .12s}
.pad button:hover{background:var(--lav-soft)}
.dots i{width:13px;height:13px}
.dots i.f{background:var(--sun);border-color:var(--sun)}

/* ---------- base (formerly supplied by the Claude page skeleton) ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;overflow-x:clip;min-height:100vh;min-height:100dvh}
img{max-width:100%}
[hidden]{display:none!important}
button,a,input,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:active,.tab:active,.chip:active,.pad button:active,.step button:active,.oc:active{transform:scale(.97)}

/* ---------- touch screens: comfortable finger targets ---------- */
@media (pointer:coarse){
  .btn{min-height:44px}
  .tab{padding:14px 15px}
  .chip{padding:8px 14px}
  .step button{width:44px;height:44px;font-size:20px}
  .step input{height:44px}
  .step.sm button{width:40px;height:40px}
  .step.sm input{height:40px}
  .chk{width:42px;height:42px;font-size:20px}
  .x{width:40px;height:40px}
  .pad button{height:62px}
  .kind button{padding:10px 14px}
}
/* swipeable strips: no visible scrollbar */
.tabs .wrap,.chips{scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs .wrap::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
/* iPhone zooms the page when a field under 16px gets focus */
@media (max-width:1024px){input,select,textarea,.mini-in,.field{font-size:16px}}

/* ---------- tablet ---------- */
@media (min-width:700px){
  .veil{align-items:center;padding:24px}
  .sheet{border-radius:20px;max-height:88vh}
}
@media (min-width:700px) and (max-width:1024px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .stats{grid-template-columns:repeat(3,1fr)}
}

/* ---------- phone ---------- */
@media (max-width:560px){
  main{padding-block:16px 150px}
  h2{font-size:20px}
  .scene .wrap{flex-direction:row;align-items:center;padding-block:10px;gap:8px}
  .logo{width:104px;height:44px}
  .tools{gap:6px;justify-content:flex-end}
  .langsel{padding:6px 10px;font-size:13px}
  .who{font-size:13px;padding-inline:10px 4px;max-width:58vw}
  .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .tab{padding:13px 12px;font-size:14px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile{padding:10px;gap:8px}
  .tile .nm{font-size:14px}
  .kind{width:100%}
  .kind button{flex:1}
  .row > div:first-child{min-width:0}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat b{font-size:22px}
  .ln{padding:10px 12px;gap:8px}
  .ln{grid-template-columns:minmax(0,1fr) 128px}
  .ln.has-chk{grid-template-columns:auto minmax(0,1fr) 120px}
  .ln .ctl{width:100%;min-width:0}
  .ln .ctl .step input{width:0;flex:1}
  .sheet{max-height:96vh;max-height:96dvh;border-radius:16px 16px 0 0}
  .sh-head,.sh-body,.sh-foot{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .sh-foot .btn{flex:1}
  .sh-foot > span{flex-basis:100%}
  .sh-head .btn{padding:0 10px;font-size:13px}
  .cartbar .wrap{gap:8px;padding-block:10px}
  .cartbar .btn{padding:0 14px}
  .code .wide{flex-wrap:wrap}
  .code .wide input{flex-basis:100%}
  .code .wide .btn{flex:1}
  .daybar input{flex:1;min-width:150px}
  .pin{margin-top:16px;padding:22px 16px}
  .pad{grid-template-columns:repeat(3,minmax(64px,80px))}
  .toast{max-width:calc(100vw - 32px);text-align:center}
}
@media (max-width:360px){
  .grid{grid-template-columns:1fr}
  .logo{width:92px;height:38px}
}
/* phone in landscape: keep sheets usable */
@media (max-height:500px) and (orientation:landscape){
  .sheet{max-height:100vh;max-height:100dvh;border-radius:0}
  .timeline{grid-template-columns:repeat(4,1fr)}
}

/* ---------- typography: Tajawal has 400/500/700/800 — 400 text, 500 UI, 700 emphasis ---------- */
body{font-synthesis:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
h2,h3,.cat-h,.rp-sec h3,.btn,.tab[aria-selected="true"],.tile .nm,.ln .nm,.oc .t,.tbl td b,.who b,.code b,.stat b,.badge,.tile .q,.pill,.tag,.box h4{font-weight:700}
.hint,.tile .alt,.tile .meta,.ln .sub,.oc .s,.stat span,.tl{font-weight:400}
.tile .alt{font-size:12.5px;opacity:.85}
.tbl th{font-size:12.5px;letter-spacing:0}
.num,.tbl td.n,.stat b,.tile .q,.badge{font-feature-settings:"tnum" 1,"lnum" 1}
textarea,input,select,button{font-family:inherit}

/* WhatsApp notify button + "order sent" card */
.btn-wa{background:var(--sun);color:#fff;text-decoration:none}
.btn-wa:hover{background:var(--sun-ink)}
.btn-wa.sm{min-height:36px;padding:0 12px;font-size:13px}
.sent-card{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid color-mix(in srgb,var(--sun) 45%,var(--line));border-inline-start:4px solid var(--sun);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.sent-card .row{gap:8px}
@media (max-width:560px){.sent-card .btn-wa{flex:1}.sh-head .btn-wa.sm{order:3;flex-basis:100%;margin-top:6px}}

.sh-head h2,.pin h2,.row h2{margin-bottom:0}

/* quantity buttons (+ / −) in the brand orange */
.step{border-color:color-mix(in srgb,var(--sun) 45%,var(--line))}
.step button{background:var(--sun);color:#fff;font-weight:700}
.step button:hover{background:var(--sun-ink);color:#fff}
.step button:active{background:var(--sun-ink)}
.step input{color:var(--fg)}

/* delete order */
.del-zone{margin-top:20px;padding-top:14px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.del-zone span{font-weight:500;color:var(--sun-ink)}
.btn-del{background:var(--sun-ink);color:#fff}
.btn-del:hover{background:var(--sun)}

/* daily report in the brand orange */
.stat{border-top:3px solid var(--sun)}
.stat b,.stat.hot b{color:var(--sun-ink)}
.stat.hot{background:var(--sun-soft)}
.rp-btn{color:var(--sun-ink);border-color:color-mix(in srgb,var(--sun) 55%,var(--line))}
.rp-btn:hover{border-color:var(--sun);background:var(--sun-soft)}
.rp-sec h3::before{content:"";display:inline-block;width:4px;height:16px;border-radius:2px;background:var(--sun);margin-inline-end:8px;vertical-align:-2px}
.attn div{border-inline-start-color:var(--sun)}

/* Maskob logo strip at the top of order windows */
.sheet-brand{flex:none;background:var(--hdr);border-bottom:3px solid var(--sun);display:flex;align-items:center;justify-content:center;padding:8px 16px}
.logo.sm{width:96px;height:40px}
@media (max-width:560px){.logo.sm{width:84px;height:34px}}

/* overdue orders in red */
.pill.late{background:var(--late);color:#fff}
.oc.late{border-inline-start-color:var(--late);background:color-mix(in srgb,var(--late-soft) 70%,var(--card));border-color:color-mix(in srgb,var(--late) 35%,var(--line))}
.badge.late{background:var(--late)}
.oc .side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* delivery scheduling */
.dchip{display:inline-block;margin-inline-start:6px;font-size:12.5px;font-weight:500;color:var(--sun-ink);background:var(--sun-soft);border-radius:6px;padding:1px 8px}
.sched-day{margin-bottom:20px}
.sched-day h3{font-size:16px;font-weight:700;margin:0 0 10px;color:var(--navy-ink);display:flex;align-items:center;gap:8px}
.sched-day h3 small{background:var(--navy);color:var(--card);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12.5px;padding:0 7px}
.sched-day.today h3{color:var(--sun-ink)}.sched-day.today h3 small{background:var(--sun)}
.sched-day.late h3{color:var(--late)}.sched-day.late h3 small{background:var(--late)}
.sched-box{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sched-box h4{margin:0}.sched-box input{width:auto;min-width:170px}
.days{grid-column:1 / -1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.days .hint{margin:0;margin-inline-end:4px}
.dday{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);min-width:44px}
.dday.on{background:var(--sun);border-color:var(--sun);color:#fff;font-weight:700}

/* branch alert: delivery date changed */
.notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid color-mix(in srgb,var(--sun) 50%,var(--line));border-inline-start:5px solid var(--sun);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.notice b{color:var(--sun-ink)}
.notice .row{gap:8px}
.notify-on{margin-bottom:14px;font-size:13px}
@media (max-width:560px){.notice .row{width:100%}.notice .row .btn{flex:1}}

.len-box{margin-bottom:10px}
.len-warn{grid-column:1 / -1;background:var(--late-soft);color:var(--late);border-radius:8px;padding:8px 12px;font-size:13.5px;font-weight:500}

.btn.del-top{padding:7px 12px;font-size:13px;min-height:36px}
.del-q{flex:1 1 100%;font-weight:700;color:var(--sun-ink)}
@media (min-width:561px){.del-q{flex:1 1 auto}}

/* branch manager pages */
.sl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.sl-grid label{display:flex;flex-direction:column;gap:4px}
.sl-form .row,.m-form .row{margin-top:6px}
.tg-bar{position:relative;height:26px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:8px}
.tg-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--sun));border-radius:8px}
.tg-bar span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--fg)}
.chart-wrap{overflow-x:auto;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ax{fill:var(--muted);font-size:10px;font-family:inherit}
.ch-bar{fill:var(--navy)}.ch-bar.today{fill:var(--sun)}
.ch-pace{stroke:var(--sun);stroke-width:2;stroke-dasharray:6 4}
.cmp{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.cmp-row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.cmp-row span{text-align:end}
.cmp-bar{position:relative;height:16px;background:var(--soft);border-radius:6px}
.cmp-bar i{display:block;height:100%;background:var(--navy);border-radius:6px}
.cmp-bar u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--sun);border-radius:2px}
.m-photos{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.m-thumb{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);display:block}
.m-thumb img{width:100%;height:100%;object-fit:cover}
.m-thumb .x{position:absolute;top:4px;inset-inline-end:4px;width:28px;height:28px;background:rgba(0,0,0,.55);color:#fff;font-size:16px}
.m-photos.big .m-thumb{width:160px;height:160px}
.m-add{width:96px;height:96px;border:2px dashed color-mix(in srgb,var(--sun) 60%,var(--line));border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--sun-ink);font-weight:700;font-size:13px;cursor:pointer;padding:6px}
.m-add input{position:absolute;width:1px;height:1px;opacity:0}
.pill.ms-open{background:var(--sun-soft);color:var(--sun-ink)}

.pill.ms-done{background:var(--navy);color:var(--card)}
.ck-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:10px}
.ck-day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.ck-col{width:26px;height:70px;background:var(--soft);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.ck-col i{display:block;width:100%;background:var(--sun);border-radius:6px}
.ck-day b{color:var(--fg)}
@media (max-width:560px){.cmp-row{grid-template-columns:80px 1fr 70px;font-size:13px}.m-photos.big .m-thumb{width:46%;height:auto;aspect-ratio:1}}

.tg-card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--sun);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.tg-card.none{border-top-color:var(--line);opacity:.85}
.tg-card.done{border-top-color:var(--navy)}

.tg-line{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted)}

.tg-card .tg-bar{margin-top:2px;height:22px}

.sched-chip{position:relative;min-height:36px;padding:0 12px;font-size:13px;color:var(--sun-ink);border-color:color-mix(in srgb,var(--sun) 55%,var(--line))}
.sched-chip input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}

.hr-filter{margin:6px 0 14px;flex-wrap:wrap}
.hr-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tbl tr.hr-exp td{background:var(--late-soft);color:var(--late)}
.tbl tr.hr-soon td{background:var(--sun-soft)}
.linkish{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--navy);cursor:pointer;text-align:start}

.hr-sub{margin:16px 0 6px;color:var(--navy)}
.hr-total{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--sun-soft);color:var(--sun-ink)}
.ct-pay{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0}.ct-tot{color:var(--sun-ink)}

.ad-bar{display:block;height:5px;border-radius:5px;background:var(--lav-soft);margin-top:6px;overflow:hidden;max-width:260px}

.ad-pay{margin-top:10px;flex-wrap:wrap}

.eos-sum{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card)}

.pill.li-valid{background:var(--navy);color:var(--card)}
.pill.li-soon{background:var(--sun-soft);color:var(--sun-ink)}
.pill.li-expired{background:var(--late-soft);color:var(--late)}
.pill.li-none{background:var(--lav-soft);color:var(--navy)}

.io-imp{position:relative;overflow:hidden}
.io-imp input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}

.oc.cat-off{opacity:.6}

.io-menu{position:relative;display:inline-block}
.io-menu>summary{list-style:none;cursor:pointer;user-select:none}
.io-menu>summary::-webkit-details-marker{display:none}
.io-menu[open]>summary{background:var(--soft)}
.io-pop{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:40;min-width:190px;display:flex;flex-direction:column;padding:6px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(7,40,80,.16)}
.io-item{display:block;width:100%;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--fg);font:inherit;font-weight:500;text-align:start;cursor:pointer;white-space:nowrap}
.io-item:hover,.io-item:focus-visible{background:var(--soft);color:var(--navy)}

.co-logo{gap:10px;flex-wrap:wrap}.co-logo img{height:44px;max-width:160px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.co-prev{width:100%;height:150px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:6px}

.lr-card{cursor:default}.lr-card .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lr-hr{border:1px solid color-mix(in srgb,var(--sun) 45%,var(--line));border-radius:var(--r);padding:12px 14px;background:color-mix(in srgb,var(--sun-soft) 45%,var(--card))}

.sh-nav{margin:10px 0 4px;flex-wrap:wrap}
.sh-bar{margin:12px 0 8px;flex-wrap:wrap;gap:8px}
.sh-times{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}.sh-times label{display:flex;align-items:center;gap:6px}.sh-times input{width:130px;min-height:34px}
.sh-grid th,.sh-grid td{text-align:center;white-space:nowrap}.sh-grid td:first-child,.sh-grid th:first-child{text-align:start}
.sh-grid th.sh-today{color:var(--sun-ink)}
.sh-c{display:inline-block;min-width:58px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
span.sh-c{cursor:default}
.sh-none{color:var(--muted);border-style:dashed}
.sh-m{background:var(--sun-soft);color:var(--sun-ink);border-color:color-mix(in srgb,var(--sun) 40%,var(--line))}
.sh-e{background:var(--lav-soft);color:var(--navy);border-color:color-mix(in srgb,var(--navy) 30%,var(--line))}
.sh-n{background:var(--navy);color:#fff;border-color:var(--navy)}
.sh-off{background:var(--soft);color:var(--muted)}
.sh-L{background:var(--late-soft);color:var(--late);border-color:color-mix(in srgb,var(--late) 35%,var(--line))}
.sh-sum td{font-weight:700;background:var(--soft)}

/* header: section name at the start (right in Arabic), logo in the middle, language at the end */
.scene .wrap.hd{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:'who logo tools';align-items:center;gap:10px}
.hd-who{grid-area:who;justify-self:start;min-width:0;max-width:100%}
.scene .wrap.hd .logo{grid-area:logo;justify-self:center}
.scene .wrap.hd .tools{grid-area:tools;justify-self:end}
@media (max-width:560px){
  .scene .wrap.hd{grid-template-columns:1fr 1fr;grid-template-areas:'logo logo' 'who tools';row-gap:8px}
  .hd-who .who{max-width:62vw}
}

/* logout: its own button at the far end of the header (left in Arabic) */
.hd-who .who{padding-inline:12px}
.logout-btn{border:0;background:var(--sun);color:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.logout-btn:hover{filter:brightness(1.05)}

.tag.fm-deduction,.tag.fm-warning{background:var(--late-soft);color:var(--late)}
.tag.fm-reward{background:var(--sun-soft);color:var(--sun-ink)}

/* ---------- side menu ---------- */
.layout{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layout.no-nav{display:block;max-width:1080px}
.scene .wrap.hd{max-width:1320px}
#main{min-width:0}
.sidenav{position:sticky;top:16px;margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;max-height:calc(100vh - 32px);overflow-y:auto;z-index:20}
.sn-in{display:flex;flex-direction:column;gap:2px}
.sidenav .tab{width:100%;display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:start;padding:10px 12px;border-radius:10px;font-size:14.5px;color:var(--fg);white-space:normal;border-inline-start:3px solid transparent}
.sidenav .tab:hover{background:var(--soft);color:var(--navy)}
.sidenav .tab[aria-selected="true"]{background:var(--lav-soft);color:var(--navy);font-weight:700;border-inline-start-color:var(--sun)}
.sidenav .tab[aria-selected="true"]::after{display:none}
.tab-ico{display:inline-flex;flex:none;width:20px;height:20px;color:var(--muted)}.tab-ico svg{width:100%;height:100%}
.sidenav .tab[aria-selected="true"] .tab-ico{color:var(--sun-ink)}
.tab-l{flex:1;min-width:0}
.sidenav .tab .badge{margin-inline-start:auto}
.menu-btn{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:var(--on-hdr);cursor:pointer;flex:none}
.menu-btn svg{width:22px;height:22px}
.hd-who{display:flex;align-items:center;gap:8px}
.sn-veil{display:none}
@media (max-width:899px){
  .layout{display:block;max-width:1080px}
  .menu-btn:not([hidden]){display:inline-flex}
  .sidenav{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(84vw,300px);margin:0;border-radius:0;max-height:none;z-index:70;
    padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px));transition:transform .25s ease;box-shadow:0 0 40px rgba(7,40,80,.25)}
  [dir="rtl"] .sidenav{transform:translateX(105%)}
  [dir="ltr"] .sidenav{transform:translateX(-105%)}
  #app.menu-open .sidenav{transform:none}
  .sn-veil{position:fixed;inset:0;z-index:65;background:rgba(5,20,40,.4)}
  #app.menu-open .sn-veil{display:block}
  .sidenav .tab{padding:12px;font-size:15px}
}

/* long lists: skip drawing what is off screen */
.grid{content-visibility:auto;contain-intrinsic-size:auto 560px}
.list>.oc{content-visibility:auto;contain-intrinsic-size:auto 88px}
.sh-body,.chips,.tabs .wrap{overscroll-behavior:contain}

@media (prefers-reduced-motion: no-preference){.tile,.oc,.chk{transition:border-color .15s,background .15s}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

function sha256js(bytes){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l=bytes.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(bytes);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(n-4,l*8);
  const W=new Uint32Array(64),r=(x,s)=>(x>>>s)|(x<<(32-s));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=W[i-15],b=W[i-2];W[i]=(W[i-16]+(r(a,7)^r(a,18)^(a>>>3))+W[i-7]+(r(b,17)^r(b,19)^(b>>>10)))>>>0}
    let[a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}

  }

/* ---------- forecast ----------
   Per branch: take its last 8 approved supply orders (approved / shipped / received),
   use the delivered quantity of each item (received, else sent, else approved),
   and compute a weighted average per order where each newer order weighs 1.35x the previous.
   Items missing from an order count as 0 for that order, so rarely ordered items shrink.
   Order cycle = median days between orders; daily use = forecast / cycle. */
const FC_MIN=7,FC_WIN=10,FC_OK=['approved','shipped','received'];
const ITEM_POS={};ITEMS.forEach((it,i)=>ITEM_POS[it.id]=i);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const delivered=l=>+(l.received??l.sent??l.approved??l.qty??0)||0;
const roundQty=(id,x)=>{const it=ITEM[id];return it&&(it.uk==='KG'||it.uk==='L')?Math.round(x*2)/2:Math.round(x)};
function forecastBranch(b){
  const h=S.orders.filter(o=>o.branch===b&&o.kind!=='return'&&FC_OK.includes(o.status)&&o.createdAt)
    .sort((x,y)=>String(x.createdAt).localeCompare(String(y.createdAt)));
  const n=h.length;if(n<FC_MIN)return{ready:false,n,items:[],map:{}};
  const win=h.slice(-FC_WIN),ts=win.map(o=>Date.parse(o.createdAt)||0);
  const gaps=[];for(let i=1;i<ts.length;i++){const g=(ts[i]-ts[i-1])/864e5;if(g>0.25)gaps.push(g)}
  const cycle=gaps.length?Math.min(30,Math.max(1,Math.round(median(gaps)*10)/10)):7;
  const ids=new Set();win.forEach(o=>(o.lines||[]).forEach(l=>ids.add(l.id)));
  const items=[];
  ids.forEach(id=>{
    const qs=win.map(o=>{const l=(o.lines||[]).find(x=>x.id===id);return l?delivered(l):0});
    let sw=0,sq=0;qs.forEach((q,i)=>{const w=Math.pow(1.35,i);sw+=w;sq+=w*q});
    const raw=sq/sw,app=qs.filter(q=>q>0).length,last=qs[qs.length-1];
    if(app<2&&last===0)return;
    const f=roundQty(id,raw);if(f<=0)return;
    const ra=avg(qs.slice(-2)),old=qs.slice(0,-2),oa=old.length?avg(old):ra;
    const trend=oa===0?(ra>0?'up':'flat'):ra>oa*1.2?'up':ra<oa*0.8?'down':'flat';
    const share=app/qs.length,conf=share>=0.6&&app>=3?'high':share>=0.3?'mid':'low';
    items.push({id,f,daily:raw/cycle,trend,conf,last});
  });
  items.sort((x,y)=>(ITEM_POS[x.id]??1e9)-(ITEM_POS[y.id]??1e9));
  const map={};items.forEach(x=>map[x.id]=x);
  return{ready:true,n,cycle,last:win[win.length-1].createdAt,next:new Date(ts[ts.length-1]+cycle*864e5).toISOString(),items,map};
}

const LATE_HOURS={pending:24,approved:24,shipped:48};
/* ---------- delivery scheduling ---------- */
const fromKey=k=>{const [y,m,d]=String(k).split('-').map(Number);return new Date(y,m-1,d)};
const weekdayName=i=>{try{return new Date(2024,0,7+i).toLocaleDateString(LOCALE[LANG],{weekday:'short'})}catch(e){return String(i)}};
const dateLabel=k=>{try{return fromKey(k).toLocaleDateString(LOCALE[LANG],{weekday:'long',day:'numeric',month:'short'})}catch(e){return k}};
/* next delivery day for a branch, from tomorrow (leaves time to prepare); tomorrow if no days are set */
function nextDeliveryDay(branch){
  const days=(S.days&&S.days[branch])||[];
  const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+1);
  if(!days.length)return dayKey(d);
  for(let i=0;i<14;i++){if(days.includes(d.getDay()))return dayKey(d);d.setDate(d.getDate()+1)}
  return dayKey(d);
}
const isWaitingDispatch=o=>o.kind!=='return'&&o.status==='approved';
function lateInfo(o){
  if(o.status==='approved'&&o.scheduledFor){            // scheduled: late once the delivery day has ended
    const due=fromKey(o.scheduledFor);due.setDate(due.getDate()+1);
    const h=(Date.now()-due.getTime())/36e5;
    return h>0?{h:Math.max(h,1)}:null;
  }
  if(!(o.status in LATE_HOURS))return null;
  const since={pending:o.createdAt,approved:o.approvedAt,shipped:o.shippedAt}[o.status];
  const h=(Date.now()-Date.parse(since))/36e5;
  return h>=LATE_HOURS[o.status]?{h}:null;
}
const lateLabel=li=>li.h<48?t('lateH',{n:Math.floor(li.h)}):t('lateD',{n:Math.floor(li.h/24)});
const latePill=o=>{const li=lateInfo(o);return li?`<span class="pill late">${esc(lateLabel(li))}</span>`:''};
function counts(){

    tasks:v.filter(o=>(o.kind!=='return'&&o.status==='shipped')||(o.kind==='return'&&o.status==='approved')),
    pending:v.filter(o=>o.status==='pending'),
    prep:v.filter(o=>o.kind!=='return'&&o.status==='approved'),
    incoming:v.filter(o=>o.kind==='return'&&o.status==='shipped'),
    sched:v.filter(o=>isWaitingDispatch(o)&&o.scheduledFor&&o.scheduledFor<=dayKey(Date.now()))
  };
  const r={};for(const k in sets){r[k]=sets[k].length;r[k+'Late']=sets[k].some(lateInfo)}
  return r;
}

}

/* ---------- daily report ---------- */
const dayKey=d=>{const x=new Date(d);if(isNaN(x))return'';const p=n=>String(n).padStart(2,'0');return`${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`};

function buildReport(day){
  const on=iso=>iso&&dayKey(iso)===day;
  const O=S.orders;
  const created=O.filter(o=>on(o.createdAt)),approved=O.filter(o=>on(o.approvedAt)&&o.status!=='rejected'),
        shipped=O.filter(o=>on(o.shippedAt)),received=O.filter(o=>on(o.receivedAt)),
        rejected=O.filter(o=>on(o.rejectedAt)||on(o.cancelledAt));
  const waiting=O.filter(o=>o.status==='pending');
  const attn=[];
  received.forEach(o=>(o.lines||[]).forEach(l=>{const s=l.sent??0;if(l.received!=null&&l.received!==s)attn.push({bad:true,text:t('rpDiff',{b:o.branch,i:lineInfo(l).name,s:fmt(s),r:fmt(l.received)})+(l.rnote?' · '+l.rnote:''),id:o.id})}));
  shipped.forEach(o=>{const n=(o.lines||[]).filter(l=>(l.sent??0)<(l.approved??l.qty)).length;if(n)attn.push({text:t('rpShort',{b:o.branch,n}),id:o.id})});
  if(day===dayKey(Date.now()))waiting.forEach(o=>{const h=Math.floor((Date.now()-Date.parse(o.createdAt))/36e5);if(h>=24)attn.push({text:h>=48?t('rpOldD',{b:o.branch,d:Math.floor(h/24)}):t('rpOld',{b:o.branch,h}),id:o.id})});
  const brs={};const bump=(list,k)=>list.forEach(o=>{const r=brs[o.branch]||(brs[o.branch]={new:0,appr:0,ship:0,recv:0,rej:0});r[k]++});
  bump(created,'new');bump(approved,'appr');bump(shipped,'ship');bump(received,'recv');bump(rejected,'rej');
  const top={};created.filter(o=>o.kind!=='return'&&o.status!=='cancelled').forEach(o=>(o.lines||[]).forEach(l=>{const r=top[l.id]||(top[l.id]={q:0,b:new Set(),l});r.q+=+l.qty||0;r.b.add(o.branch)}));
  const topList=Object.values(top).sort((a,b)=>b.q-a.q).slice(0,10);
  const ids=new Set();[created,approved,shipped,received,rejected].forEach(a=>a.forEach(o=>ids.add(o.id)));
  const dayOrders=O.filter(o=>ids.has(o.id));
  return{counts:{new:created.length,appr:approved.length,ship:shipped.length,recv:received.length,rej:rejected.length,wait:waiting.length},attn,brs,topList,dayOrders};
}

/* most requested first: how many of this branch's orders included each item (then total quantity) */
function popularity(){
  const key=S.orders.length+'|'+S.orders.map(o=>o.updatedAt||o.createdAt).join(',').length+'|'+(S.branch||'')+'|'+(S._catV||0);   // catalog version: edits rebuild the list
  if(S._popKey===key)return S._pop;
  const m={};
  S.orders.forEach(o=>{
    if(o.kind==='return'||o.status==='cancelled'||o.status==='rejected')return;
    if(S.role==='branch'&&o.branch!==S.branch)return;
    (o.lines||[]).forEach(l=>{const r=m[l.id]||(m[l.id]={n:0,q:0});r.n++;r.q+=+(l.approved??l.qty)||0});
  });
  const score=id=>m[id]||{n:0,q:0};
  const byPop=(a,b)=>{const x=score(a.id),y=score(b.id);return(y.n-x.n)||(y.q-x.q)||(ITEM_POS[a.id]-ITEM_POS[b.id])};
  const cats=CATS.map((c,i)=>({c,i,n:c.list.reduce((t,it)=>t+score(it.id).n,0),list:[...c.list].sort(byPop)}))
    .sort((a,b)=>(b.n-a.n)||(a.i-b.i));
  S._pop={cats,score};S._popKey=key;return S._pop;
}

function curWork(){const o=S.orders.find(x=>x.id===S.open);if(!o)return null;let w=S.work[o.id];if(!w||w.status!==o.status)w=initWork(o);return{o,w}}

function findLocal(pin){
  return(async()=>{for(const e of pinEntries()){if(await hashPin(e.key,pin)===e.h)return e}return null})();
}
async function findCode(pin){
  if(!S.fb)return findLocal(pin);
  // Firebase: the server checks the code; try each role/branch until a session is accepted
  // look the code up: codes/{hash} exists only for the role/branch the code belongs to
  const keys=[['admin',null],['manager',null],['warehouse',null],['hr',null],...S.branches.map(b=>['branch',b])];
  const hits=await Promise.all(keys.map(async([role,branch])=>{
    const key=role==='branch'?'branch:'+branch:role;const h=await hashPin(key,pin);
    try{const s=await db.doc('codes/'+h).get();return s.exists?{role,branch,key,h}:null}catch(e){return null}
  }));
  const e=hits.find(Boolean);
  if(e&&await Store.fbTrySession(e.role,e.branch,e.h))return e;
  return null;
}
/* sign in as soon as the typed code matches: codes are 4–6 digits, so try after the 4th, 5th
   and 6th digit; a miss stays quiet while the person may still be typing, and becomes
   "wrong code" after a short pause or at the 6th digit */
let chkTimer=null,chkSeq=0;
function cancelCheck(){clearTimeout(chkTimer);chkSeq++;S.pad.checking=false}
/* fixed code length from Settings (null = flexible 4-6) */
const codeLenSet=()=>[4,5,6].includes(S.codeLen)?S.codeLen:null;
const codeOk=v=>{const L=codeLenSet();return L?new RegExp('^[0-9]{'+L+'}$').test(v):/^[0-9]{4,6}$/.test(v)};
const codeLenMsg=()=>codeLenSet()?t('codeLenN',{n:codeLenSet()}):t('codeLen');
const codePh=()=>codeLenSet()?t('newCodePhN',{n:codeLenSet()}):t('newCodePh');
function scheduleCheck(){
  clearTimeout(chkTimer);
  const L=S.pad;if(L.val.length<4)return;
  const CL=codeLenSet();
  if(CL){if(L.val.length===CL)autoCheck(true);return}   // fixed length: decide at the last digit
  autoCheck(L.val.length>=6);
  if(L.val.length<6)chkTimer=setTimeout(()=>autoCheck(true),1600);
}
function wrongCode(){
  const L=S.pad;S.fails++;L.val='';L.err=t('wrongCode');L.checking=false;
  if(S.fails>=5){S.fails=0;S.lockUntil=Date.now()+30000;setTimeout(render,30100)}
  render();
}
async function autoCheck(final){
  const L=S.pad;
  if(L.step!=='enter'||L.val.length<4||Date.now()<S.lockUntil||S.signingIn)return;
  const pin=L.val,seq=++chkSeq;
  if(L.miss===pin){if(final)wrongCode();return}      // already known not to match
  L.checking=true;render();
  const e=await findCode(pin);
  if(seq!==chkSeq||S.pad.val!==pin)return;           // the person kept typing; a newer check decides
  L.checking=false;
  if(e){S.signingIn=true;clearTimeout(chkTimer);S.fails=0;loginOk(e.role,e.h,e.branch);S.signingIn=false;render();return}
  L.miss=pin;
  if(final)wrongCode();else render();
}
/* refuse a code that starts with, or is the start of, another code (auto sign-in would stop early) */
async function overlapsOther(v,key){
  const others=pinEntries().filter(e=>e.key!==key);if(!others.length)return false;
  const cands=[];
  for(let n=4;n<v.length;n++)cands.push(v.slice(0,n));
  if(v.length<6)for(let a=0;a<10;a++){cands.push(v+a);if(v.length<5)for(let b=0;b<10;b++)cands.push(v+a+b)}
  for(const p of cands)for(const e of others)if(await hashPin(e.key,p)===e.h)return true;
  return false;
}
const fieldKey=f=>({appr:'approved',sent:'sent',recv:'received'}[f]);

  },

  const el=ev.target;const k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='q'){S.q=el.value;clearTimeout(S._qT);S._qT=setTimeout(render,140);return}

document.addEventListener('keydown',ev=>{
  if(!S.role&&S.pinsLoaded&&!/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)){
    if(/^[0-9]$/.test(ev.key)){A.pinKey({dataset:{k:ev.key}});ev.preventDefault();return}
    if(ev.key==='Backspace'){A.pinDel();ev.preventDefault();return}
    if(ev.key==='Enter'){A.pinGo();ev.preventDefault();return}
    if(ev.key==='Escape'){A.pinClear();return}
  }
  if(ev.key==='Escape'&&(S.open||S.review))A.close();
  if(ev.key==='Enter'&&ev.target.id==='newBranch')A.addBranch();
});

/* ---------- sales: numbers for a branch and month ---------- */
function salesStats(branch,mk){
  const rows=(S.sales||[]).filter(r=>r.branch===branch&&String(r.date).startsWith(mk));
  const sales=rows.reduce((a,r)=>a+(+r.sales||0),0),inv=rows.reduce((a,r)=>a+(+r.invoices||0),0);
  const td=(S.targets&&S.targets[branch])||{};const tg=(td.m&&td.m[mk])||{};
  const dim=daysInMonth(mk),today=dayKey(Date.now());
  const daysLeft=mk===today.slice(0,7)?dim-(+today.slice(8))+1:(mk>today.slice(0,7)?dim:0);
  const remain=tg.sales?Math.max(0,tg.sales-sales):null;
  return{rows,sales,inv,avg:inv?sales/inv:0,days:rows.length,target:+tg.sales||0,targetInv:+tg.invoices||0,
    pct:tg.sales?sales/tg.sales:null,pctInv:tg.invoices?inv/tg.invoices:null,remain,
    perDay:remain&&daysLeft>0?remain/daysLeft:null,dim,daysLeft};
}
function kpi(label,value,cls){return`<div class="stat ${cls||''}"><b class="num">${value}</b><span>${esc(label)}</span></div>`}
function progress(p){const v=Math.max(0,Math.min(1,p||0));return`<div class="tg-bar"><i style="width:${Math.round(v*100)}%"></i><span class="num">${Math.round((p||0)*100)}%</span></div>`}

/* daily bar chart (SVG), with the target pace as a dashed line */
function dailyChart(st,mk,metric){
  const dim=st.dim,by={};st.rows.forEach(r=>by[+String(r.date).slice(8)]=r);
  const vals=[];for(let d=1;d<=dim;d++){const r=by[d];vals.push(r?(+r[metric]||0):0)}
  const pace=metric==='sales'?(st.target?st.target/dim:0):(st.targetInv?st.targetInv/dim:0);
  const max=Math.max(1,...vals,pace)*1.15;
  const W=dim*20+44,H=180,top=10,bottom=24,left=40,ch=H-top-bottom,bw=12;
  const y=v=>top+ch-(v/max)*ch;
  const today=dayKey(Date.now()),isNow=today.startsWith(mk),td=+today.slice(8);
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line x1="${left}" x2="${W-4}" y1="${yy}" y2="${yy}" class="ch-grid"/><text x="${left-6}" y="${yy+4}" class="ch-ax" text-anchor="end">${esc(sar(v))}</text>`}
  vals.forEach((v,i)=>{const d=i+1,x=left+i*20+4;const h=Math.max(v?2:0,(v/max)*ch);
    g+=`<rect x="${x}" y="${top+ch-h}" width="${bw}" height="${h}" rx="2" class="${isNow&&d===td?'ch-bar today':'ch-bar'}"><title>${d}: ${esc(sar(v))}</title></rect>`;
    if(d===1||d%5===0)g+=`<text x="${x+bw/2}" y="${H-6}" class="ch-ax" text-anchor="middle">${d}</text>`});
  if(pace)g+=`<line x1="${left}" x2="${W-4}" y1="${y(pace)}" y2="${y(pace)}" class="ch-pace"/>`;
  return`<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(t(metric==='sales'?'sl_sales':'sl_inv'))}" style="min-width:${Math.min(W,640)}px">${g}</svg></div>`;
}

/* shrink a photo on the phone before upload: max 1280px, JPEG, under ~600 KB of text */
async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,1280/Math.max(img.width,img.height));const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    let q=0.72,d=c.toDataURL('image/jpeg',q);while(d.length>600000&&q>0.3){q-=0.1;d=c.toDataURL('image/jpeg',q)}
    return d;
  }finally{URL.revokeObjectURL(url)}
}

/* ---------- actions ---------- */
Object.assign(A,{
  async saveSales(){
    const f=S.slForm||{};const day=(document.getElementById('slDay')||{}).value||dayKey(Date.now());
    const sales=num(f.sales),inv=Math.round(num(f.invoices));
    if(!(sales>0)||!(inv>0)){toast(t('sl_need'));return}
    if(day>dayKey(Date.now())){toast(t('sl_future'));return}
    const id=S.branch+'_'+day;
    guard(()=>X.put('sales',id,{branch:S.branch,date:day,sales,invoices:inv,at:nowIso()}),()=>t('sl_saved'));
  },
  slEdit(el){S.slDay=el.dataset.d;S.slForm=null;render();window.scrollTo(0,0)},
  slMetric(el){S.slMetric=el.dataset.k;render()},
  openMaint(el){
    S.openMaint=el.dataset.id;S.mReply=null;render();
    const m=(S.maint||[]).find(x=>x.id===S.openMaint);
    if(m&&m.photos&&!(S.mPhotos&&S.mPhotos[m.id]))X.photos(m.id).then(p=>{(S.mPhotos||(S.mPhotos={}))[m.id]=p;render()}).catch(()=>{});
  },
  mDelPhoto(el){S.mDraft.photos.splice(+el.dataset.i,1);render()},
  mFilter(el){S.mFilter=el.dataset.k;render()},
  async sendMaint(){
    const d=S.mDraft;if(!d||!d.desc.trim())return;
    const id='M-'+dayKey(Date.now()).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
    const tm=nowIso();const photos=[...d.photos];
    guard(async()=>{
      await X.put('maintenance',id,{branch:S.branch,desc:d.desc.trim(),cat:d.cat,urgent:!!d.urgent,status:'open',createdAt:tm,updatedAt:tm,photos:photos.length});
      for(let i=0;i<photos.length;i++)await X.photo(id,'p'+i,photos[i],S.branch);
      S.mDraft={desc:'',cat:'other',urgent:false,photos:[]};
    },()=>t('m_sent'));
  },
  mStatus(el){const id=S.openMaint;if(!id)return;guard(()=>X.upd('maintenance',id,{status:el.dataset.k,updatedAt:nowIso()}),()=>t('m_updated'))},
  mSaveReply(){const id=S.openMaint;if(!id)return;const v=(S.mReply!=null?S.mReply:'').trim();guard(()=>X.upd('maintenance',id,{opsNote:v,updatedAt:nowIso()}),()=>t('m_updated'))},
  ckToggle(el){
    const today=dayKey(Date.now()),id=S.branch+'_'+today;
    const doc=(S.checks||[]).find(c=>c.id===id)||{};
    if(!S.ckDraft||S.ckDraft.id!==id)S.ckDraft={id,items:Object.assign({},doc.items||{})};
    const k=el.dataset.k;S.ckDraft.items[k]=!S.ckDraft.items[k];if(!S.ckDraft.items[k])delete S.ckDraft.items[k];
    render();
    clearTimeout(S._ckT);S._ckT=setTimeout(()=>{const items=checklistItems();const marks=S.ckDraft.items;
      const done=items.filter(x=>marks[itemKey(x)]).length;
      X.put('checks',id,{branch:S.branch,date:today,items:marks,done,total:items.length,at:nowIso()}).catch(()=>toast(t('saveFail')))},600);
  },
  saveTarget(el){const b=el.dataset.b,mk=S.slMonth||monthKey(Date.now());const key=mk+'|'+b;const d=(S.tgDraft&&S.tgDraft[key])||{};const cur=tgFor(b,mk);
    const sales=num(d.sales!=null?d.sales:cur.sales),invoices=Math.round(num(d.invoices!=null?d.invoices:cur.invoices));
    guard(async()=>{await X.target(b,mk,{sales,invoices});if(S.tgDraft)delete S.tgDraft[key]},()=>t('tg_saved'))},
  copyPrevTargets(){const mk=S.slMonth||monthKey(Date.now()),pm=prevMonth(mk);
    const todo=S.branches.filter(b=>{const p=tgFor(b,pm);return(p.sales||p.invoices)});
    if(!todo.length){toast(t('tg_nothing'));return}
    guard(async()=>{for(const b of todo){const p=tgFor(b,pm);await X.target(b,mk,{sales:+p.sales||0,invoices:+p.invoices||0})}S.tgDraft={}},()=>t('tg_copied',{n:todo.length}))},
  saveChecklist(){const items=String(S.ckEdit!=null?S.ckEdit:checklistItems().join('\n')).split('\n').map(x=>x.trim()).filter(Boolean).slice(0,40);
    if(!items.length){toast(t('ck_needOne'));return}
    guard(async()=>{await X.checklist(items);S.ckEdit=null},()=>t('ck_saved'))}
});
document.addEventListener('input',ev=>{
  const el=ev.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='slSales'||k==='slInv'){S.slForm=S.slForm||{day:S.slDay||dayKey(Date.now())};S.slForm[k==='slSales'?'sales':'invoices']=el.value;return}
  if(k==='mDesc'){S.mDraft.desc=el.value;const b=document.querySelector('[data-act="sendMaint"]');if(b)b.disabled=!el.value.trim();return}
  if(k==='mReply'){S.mReply=el.value;return}
  if(k==='ckEdit'){S.ckEdit=el.value;return}
  if(k==='tgS'||k==='tgI'){const b=(S.slMonth||monthKey(Date.now()))+'|'+el.dataset.b;S.tgDraft=S.tgDraft||{};S.tgDraft[b]=S.tgDraft[b]||{};S.tgDraft[b][k==='tgS'?'sales':'invoices']=el.value;return}
});
document.addEventListener('change',async ev=>{
  const el=ev.target;
  if(el.id==='slDay'){S.slDay=el.value;S.slForm=null;render();return}
  if(el.id==='slMonth'){if(/^[0-9]{4}-[0-9]{2}$/.test(el.value)){S.slMonth=el.value;render()}return}
  if(el.id==='mCat'){S.mDraft.cat=el.value;return}
  if(el.id==='mUrgent'){S.mDraft.urgent=el.checked;return}
  if(el.id==='mFile'&&el.files&&el.files[0]){
    S.mBusy=true;render();
    try{const d=await compressImage(el.files[0]);if(S.mDraft.photos.length<3)S.mDraft.photos.push(d)}catch(e){toast(t('m_photoFail'))}
    S.mBusy=false;render();
  }
});

/* ================= Human resources: employees, document expiry, leave ================= */
const HR_WARN=60;                                   // documents expiring within this many days are listed
const HR_DOCS=['idExp','healthExp','contractEnd'];
const HR_DOC_L={idExp:'hr_idExp',healthExp:'hr_health',contractEnd:'hr_contract'};
const LEAVE_TYPES=['annual','sick','emergency','unpaid'];
const hrPlaces=()=>[...S.branches,'@wh','@office'];
const placeL=p=>p==='@all'?t('li_allPlaces'):p==='@wh'?t('r_warehouse'):p==='@office'?t('hr_office'):(p||'—');
const dayDiff=(a,b)=>Math.round((fromKey(b)-fromKey(a))/864e5);     // b - a in days
const leaveDays=l=>l.from&&l.to?dayDiff(l.from,l.to)+1:0;
const empById=id=>(S.emps||[]).find(e=>e.id===id);
const empName=id=>{const e=empById(id);return e?e.name:'—'};
const onLeaveToday=e=>{const d=dayKey(Date.now());return(S.leaves||[]).some(l=>l.emp===e.id&&l.status==='approved'&&l.from<=d&&l.to>=d)};
/* every document of working staff that expires within HR_WARN days (or already expired) */
function hrDocAlerts(){
  const today=dayKey(Date.now()),out=[];
  (S.emps||[]).filter(e=>e.status!=='left').forEach(e=>HR_DOCS.forEach(k=>{
    if(!e[k])return;const left=dayDiff(today,e[k]);
    if(left<=HR_WARN)out.push({e,k,date:e[k],left});
  }));
  return out.sort((a,b)=>a.left-b.left);
}
const leftLabel=n=>n<0?t('hr_daysAgo',{n:-n}):n===0?t('hr_today'):t('hr_daysLeft',{n});
function hrTabs(){
  const al=hrDocAlerts(),pend=(S.leaves||[]).filter(l=>l.status==='pending').length+(S.leaveReqs||[]).filter(r=>r.status==='pending').length;
  return[{k:'emps',l:t('tab_emps')},{k:'docs',l:t('tab_docs'),b:al.length,late:al.some(a=>a.left<0)},{k:'leaves',l:t('tab_leaves'),b:pend},{k:'custody',l:t('tab_custody'),b:(S.custody||[]).filter(custOut).length},{k:'advances',l:t('tab_adv'),b:(S.advances||[]).filter(a=>advRemain(a)>0).length},{k:'lic',l:t('tab_lic'),b:(S.licenses||[]).filter(l=>['expired','soon'].includes(licState(l))).length,late:(S.licenses||[]).some(l=>licState(l)==='expired')},{k:'vouchers',l:t('tab_vc')},{k:'forms',l:t('tab_forms'),b:(S.forms||[]).filter(f=>f.status==='pending').length}];
}
function hrView(tb){
  if(tb==='docs')return hrDocsView();
  if(tb==='leaves')return hrLeavesView();
  if(tb==='custody')return custodyView();
  if(tb==='advances')return advancesView();
  if(tb==='lic')return licensesView();
  if(tb==='vouchers')return vouchersView();
  if(tb==='forms')return hrFormsView();
  return hrEmpsView();
}

}

/* ---------- allowances and pay ---------- */
const ALLOWANCES=['alHousing','alTransport','alFood','alOther'];
const AL_L={alHousing:'al_housing',alTransport:'al_transport',alFood:'al_food',alOther:'al_other'};
const payTotal=e=>(+e.salary||0)+ALLOWANCES.reduce((a,k)=>a+(+e[k]||0),0);
const isDay=v=>/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(v||'');
const normIban=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const ibanOk=v=>/^[A-Z]{2}[0-9]{2}[A-Z0-9]{10,30}$/.test(normIban(v));
const ibanFmt=v=>normIban(v).replace(/(.{4})/g,'$1 ').trim();
function empData(d,id){
  const tm=nowIso();
  const data={name:String(d.name||'').trim(),status:d.status==='left'?'left':'active',updatedAt:tm};

  const old=empById(id)||{};data.createdAt=old.createdAt||tm;if(old.contract)data.contract=old.contract;

}

/* print in a new window; if pop-ups are blocked, print from a hidden frame */
function printHtml(html,win){

/* ---------- end of service (إنهاء الخدمة) and final settlement ---------- */
const EOS_REASONS=['contract','resign','employer','mutual','art80','other'];
/* calendar difference: years, months, days (inclusive of the last day) */
function ymd(a,b){
  const s=fromKey(a),e=fromKey(b);e.setDate(e.getDate()+1);
  let y=e.getFullYear()-s.getFullYear(),m=e.getMonth()-s.getMonth(),d=e.getDate()-s.getDate();
  if(d<0){m--;d+=new Date(e.getFullYear(),e.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  return{y:Math.max(0,y),m:Math.max(0,m),d:Math.max(0,d)};
}
const ymdText=p=>[p.y?t('eos_y',{n:p.y}):'',p.m?t('eos_m',{n:p.m}):'',p.d?t('eos_d',{n:p.d}):''].filter(Boolean).join(' ، ')||t('eos_d',{n:0});
const r2=x=>Math.round((+x||0)*100)/100;
/* Saudi Labor Law: half a month's wage for each of the first five years, a full month for each year after
   (fractions pro rata); resignation: none under 2 years, 1/3 for 2-5, 2/3 for 5-10, full from 10 (art. 85);
   dismissal under art. 80: none */
function eosCalc(e,d){
  const ok=isDay(d.start)&&isDay(d.last)&&d.last>=d.start;
  const days=ok?dayDiff(d.start,d.last)+1:0,years=days/365;
  const wage=num(d.wage);
  const full=years<=5?years*wage/2:2.5*wage+(years-5)*wage;
  const factor=d.reason==='art80'?0:d.reason==='resign'?(years<2?0:years<5?1/3:years<10?2/3:1):1;
  const award=r2(full*factor),leaveComp=r2(num(d.leaveDays)*wage/30),otherDue=r2(num(d.otherDue));
  const adv=r2((S.advances||[]).filter(a=>a.emp===e.id).reduce((s,a)=>s+advRemain(a),0));
  const cust=(S.custody||[]).filter(c=>c.emp===e.id&&custOut(c));
  const custVal=r2(cust.reduce((s,c)=>s+(+c.value||0),0));
  const dedAdv=d.dedAdv?adv:0,dedCust=d.dedCust?custVal:0,otherDed=r2(num(d.otherDed));
  const net=r2(award+leaveComp+otherDue-dedAdv-dedCust-otherDed);
  return{ok,days,years,period:ok?ymd(d.start,d.last):{y:0,m:0,d:0},wage,full:r2(full),factor,award,leaveComp,otherDue,adv,cust,custVal,dedAdv,dedCust,otherDed,net};
}
const factorText=f=>f===1?t('eos_fFull'):f===0?t('eos_fNone'):f<0.5?t('eos_fThird'):t('eos_fTwoThirds');
function eosDefaults(e){
  const st=e.settlement;if(st&&st.input)return Object.assign({},st.input);
  const last=dayKey(Date.now()),start=e.hire||'';
  // leave before the employee was added here is not recorded, so only estimate the balance from then on
  const added=e.createdAt?dayKey(e.createdAt):last,from=isDay(start)&&start>added?start:added;
  const yrs=Math.max(0,(dayDiff(from,last)+1)/365);
  const per=(e.contract&&+e.contract.leave)||21;
  const used=(S.leaves||[]).filter(l=>l.emp===e.id&&l.type==='annual'&&l.status==='approved').reduce((s,l)=>s+leaveDays(l),0);
  return{start,last,reason:'contract',wage:payTotal(e)||'',leaveDays:Math.max(0,Math.round(yrs*per-used)),otherDue:'',otherDed:'',dedAdv:true,dedCust:false,note:''};
}

function ioOut(def,row,c){

function ioDate(v){
  if(v instanceof Date&&!isNaN(v))return dayKey(v);
  if(typeof v==='number'&&window.XLSX){const p=XLSX.SSF.parse_date_code(v);if(p&&p.y)return`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;return null}
  const s=asciiDigits(v).trim();let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/),y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3]}else if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))){d=+m[1];mo=+m[2];y=+m[3]}else return null;
  const dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return dayKey(dt);
}
function ioIn(c,raw,ctx){
  const [k,lk,type]=c;const label=t(lk);
  if(raw==null||String(raw).trim()==='')return{skip:true};
  const s=typeof raw==='string'?raw.trim():raw;
  if(type==='num'){const n=typeof s==='number'?s:Number(asciiDigits(s).replace(/[,،\s]/g,'').replace(/[^\d.\-]/g,''));return isFinite(n)&&String(s)!==''?{v:n}:{err:t('io_badNum',{c:label})}}
  if(type==='date'){const d=ioDate(s);return d?{v:d}:{err:t('io_badDate',{c:label})}}
  if(type==='month'){const m=asciiDigits(s).trim().match(/^(\d{4})[-\/.](\d{1,2})$/);if(m)return{v:m[1]+'-'+String(+m[2]).padStart(2,'0')};const d=ioDate(s);return d?{v:d.slice(0,7)}:{err:t('io_badDate',{c:label})}}
  const low=String(s).toLowerCase();
  if(type==='place'||type==='branch'){
    const b=S.branches.find(x=>x.toLowerCase()===low);if(b)return{v:b};
    if(type==='place')for(const pk in PLACE_KEYS)if(pk===low||labelsOf(PLACE_KEYS[pk]).includes(low))return{v:pk};
    return{err:t('io_noPlace',{v:s})}}
  if(type==='emp'){const L=S.emps||[];const e=L.find(x=>x.no&&String(x.no)===String(s))||L.find(x=>x.idNo&&String(x.idNo)===String(s))||L.find(x=>x.name===s);return e?{v:e.id}:{err:t('io_noEmp',{v:s})}}
  if(type==='cat'){const c=CATS.find(c=>c.k===low||c.n.some(n=>String(n).toLowerCase()===low));return c?{v:c.k}:{err:t('io_badOpt',{c:label,v:s})}}
  if(type==='unit'){const u=Object.keys(UNITS).find(k=>k.toLowerCase()===low||UNITS[k].some(n=>String(n).toLowerCase()===low));return{v:u||String(s)}}
  if(type==='litype'){const kind=ctx.kind||'license';const opts=LIC_TYPES[kind];
    const hit=opts.find(o=>o===low||labelsOf((kind==='contract'?'ct_':'li_')+'t_'+o).includes(low));return hit?{v:hit}:{err:t('io_badOpt',{c:label,v:s})}}
  if(type&&typeof type==='object'){for(const ok in type)if(ok===low||labelsOf(type[ok]).includes(low))return{v:ok};return{err:t('io_badOpt',{c:label,v:s})}}
  return{v:String(s)};
}
async function ioRead(k,file){
  const def=IO[k];
  try{await ensureXlsx();if(!window.XLSX)throw 0}catch(e){toast(t('xlsFail'));return}
  let aoa;
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''})}
  catch(e){toast(t('io_readFail'));return}
  const known=new Set(def.cols.flatMap(c=>[c[0].toLowerCase(),...labelsOf(c[1])]));
  let hi=-1,best=0;
  aoa.slice(0,25).forEach((r,i)=>{const n=r.filter(v=>known.has(normH(v))).length;if(n>best){best=n;hi=i}});
  if(hi<0)hi=aoa.findIndex(r=>r.some(v=>String(v).trim()!==''));
  const imp={k,file:file.name,ok:[],errors:[],missing:[]};
  if(hi<0){imp.fatal=t('io_empty');S.imp=imp;render();return}
  const head=aoa[hi].map(normH);
  // which file column holds each dataset column (header text in any language, or the field key)
  const at={};def.cols.forEach(c=>{const names=[c[0].toLowerCase(),...labelsOf(c[1])];const i=head.findIndex(h=>names.includes(h));if(i>=0)at[c[0]]=i});
  imp.missing=def.cols.filter(c=>c[3]===1&&at[c[0]]==null&&!(k==='sales'&&c[0]==='branch')).map(c=>t(c[1]));
  if(k==='sales'&&S.role==='manager'&&at.branch==null)imp.missing.push(t('r_branch'));
  if(k==='employees'&&at.name==null&&at.no==null&&at.idNo==null)imp.missing.push(t('hr_name'));
  if(imp.missing.length){imp.fatal=t('io_missing',{c:imp.missing.join('، ')});S.imp=imp;render();return}
  const list=def.list().map(x=>Object.assign({},x));   // copies: nothing changes until the import is confirmed
  for(let i=hi+1;i<aoa.length;i++){
    const row=aoa[i];if(!row.some(v=>String(v).trim()!==''))continue;
    const r={},errs=[];
    for(const c of def.cols){if(at[c[0]]==null)continue;const x=ioIn(c,row[at[c[0]]],r);
      if(x.err)errs.push(x.err);else if(!x.skip)r[c[0]]=x.v;else if(c[3]===1)errs.push(t('io_req',{c:t(c[1])}))}
    if(!errs.length&&def.check){const e=def.check(r);if(e)errs.push(e)}
    if(errs.length){imp.errors.push({n:i+1,msg:errs.join(' — ')});continue}
    const old=def.match(r,list);
    // flag 2 = needed only when the row creates a new record (an update can leave it out)
    const needNew=old?[]:def.cols.filter(c=>c[3]===2&&r[c[0]]==null);
    if(needNew.length){imp.errors.push({n:i+1,msg:needNew.map(c=>t('io_req',{c:t(c[1])})).join(' — ')});continue}
    const data=def.build(r,old);
    const id=old?old.id:(def.idOf?def.idOf(data):hrId(def.idp));
    const tm=nowIso();if(def.col&&def.col!=='sales'){data.updatedAt=tm;if(!data.createdAt)data.createdAt=tm}
    delete data.id;
    const prev=imp.ok.find(x=>x.id===id);
    if(prev)prev.data=data;else imp.ok.push({id,data,isNew:!old});
    if(!old)list.push(Object.assign({},data,{id}));else Object.assign(old,data);
  }
  if(!imp.ok.length&&!imp.errors.length)imp.fatal=t('io_empty');
  S.imp=imp;render();
}

/* amount in Arabic words: "فقط ألف ومائتان وخمسون ريالاً لا غير" */
function tafqeet(x){
  const U=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const TN=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const HN=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const b1000=n=>{const p=[],h=Math.floor(n/100),r=n%100;if(h)p.push(HN[h]);if(r){if(r<20)p.push(U[r]);else{const u=r%10,tt=Math.floor(r/10);p.push(u?U[u]+' و'+TN[tt]:TN[tt])}}return p.join(' و')};
  const scale=(n,one,two,few,many)=>n===1?one:n===2?two:n<=10?b1000(n)+' '+few:b1000(n)+' '+many;
  const words=n=>{if(!n)return'صفر';const p=[];const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000;
    if(m)p.push(scale(m,'مليون','مليونان','ملايين','مليون'));if(k)p.push(scale(k,'ألف','ألفان','آلاف','ألف'));if(r)p.push(b1000(r));return p.join(' و')};
  const v=Math.round((+x||0)*100),ri=Math.floor(v/100),ha=v%100;
  return'فقط '+words(ri)+' ريال'+(ha?' و'+words(ha)+' هللة':'')+' لا غير';
}
